name: Import verified V46ak stable snapshot

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  import-stable:
    if: github.repository == 'temesotejam/atoms3r-amplitude-control-v46ak-stable'
    runs-on: ubuntu-latest
    steps:
      - name: Seed all verified source blobs into target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: 269281ab6b090778a7c82f6abfadb208ce27757b
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          git clone --no-tags https://github.com/temesotejam/atoms3r-amplitude-control-development.git source
          cd source
          git checkout "$SOURCE_SHA"
          if [ -d .github/workflows ]; then
            mv .github/workflows .github/workflows-snapshot
          fi
          rm -rf .git
          git init -b stable-import
          git config user.name "stable-snapshot-import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Seed verified V46ak snapshot blobs"
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --force target HEAD:refs/heads/snapshot-import
